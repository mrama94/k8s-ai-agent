name: agent-image

# Builds the agent image, pushes it to GitHub Container Registry, and commits the new tag into
# apps/agent/kustomization.yaml. Argo CD sees that commit and rolls the agent out. Nothing is deployed from here directly.
on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent-image.yml"
  workflow_dispatch:

permissions:
  contents: write   # to commit the new image tag
  packages: write   # to push to ghcr.io

# One build at a time, so two quick pushes cannot race to write the tag.
concurrency:
  group: agent-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/k8s-agent

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # An image is never built from code whose tests fail.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/constraints.txt
      - name: Run the unit tests
        run: |
          pip install -r agent/requirements.txt -r agent/requirements-dev.txt -c agent/constraints.txt
          cd agent && python -m pytest -q

      - id: tag
        name: Image tag from the commit
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The nodes of the kind cluster run on Apple Silicon, so the image is built for linux/arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          # Links the package to this repository, so it stays private and the repo's token can push to it.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the agent at the new image
        run: |
          sed -i -E "s|newName: .*|newName: ${IMAGE}|; s|newTag: .*|newTag: ${{ steps.tag.outputs.value }}|" apps/agent/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/agent/kustomization.yaml
          if git diff --cached --quiet; then echo "tag already current"; exit 0; fi
          git commit -m "ci: deploy agent image ${{ steps.tag.outputs.value }}"
          git pull --rebase origin main
          git push origin HEAD:main
