<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>Local Kubernetes Agent</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 5rem; box-sizing: border-box; }
  pre { background: #f4f4f4; padding: .75rem; white-space: pre-wrap; border-radius: 6px; }
  .bar { color: #555; font-size: .9rem; margin: .5rem 0 1rem; }
  .blocked { color: #b00020; }
  .turn { border-top: 1px solid #ddd; margin-top: 1rem; padding-top: .5rem; }
  .user { font-weight: 600; white-space: pre-wrap; }
  .alerts { border: 1px solid #ddd; border-radius: 6px; padding: .5rem .75rem; margin-bottom: 1rem; }
  .alert { display: flex; gap: .5rem; align-items: center; padding: .25rem 0; font-size: .9rem; }
  .badge { border-radius: 10px; padding: 0 .5rem; font-size: .75rem; background: #eee; }
  .badge.awaiting_approval { background: #ffe2a8; }
  .badge.done { background: #cfeccf; }
  .badge.error, .badge.interrupted { background: #f6c6cb; }
  button { padding: .5rem 1rem; margin-right: .5rem; }
</style>
</head>
<body>
<h1>Kubernetes Agent (local)</h1>
<div class='bar' id='usage'>conversation tokens in/out: 0 / 0 | LLM time: 0 s | cost: $0.00</div>
<div class='alerts'><strong>Alerts</strong> <span id='alert-note' style='color:#555;font-size:.85rem'></span><div id='alert-list'></div></div>
<textarea id='msg'>The pod web-service in namespace demo is stuck in Pending. Why, and how do I fix it?</textarea>
<p><button id='send'>Send</button><button id='reset'>New conversation</button></p>
<div id='log'></div>
<script>
const $ = (id) => document.getElementById(id);
let conversationId = null;
const total = { in: 0, out: 0, sec: 0 };

function add(parent, tag, text, cls) {
  const el = document.createElement(tag);
  el.textContent = text;
  if (cls) el.className = cls;
  parent.appendChild(el);
  return el;
}

async function post(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

const bullets = (items) => (items.length ? '- ' + items.join('\n- ') : '(none)');

const seen = {};  // thread_id -> usage already added to the running total

function showUsage(data) {
  const u = data.usage, prev = seen[data.thread_id] || { tokens_in: 0, tokens_out: 0, llm_seconds: 0 };
  total.in += u.tokens_in - prev.tokens_in;
  total.out += u.tokens_out - prev.tokens_out;
  total.sec += u.llm_seconds - prev.llm_seconds;
  seen[data.thread_id] = u;
  $('usage').textContent = `conversation tokens in/out: ${total.in} / ${total.out} | LLM time: ${total.sec.toFixed(1)} s | cost: $0.00`;
}

function render(data, out) {
  conversationId = data.conversation_id;
  showUsage(data);
  const threadId = data.thread_id;
  const decide = (approved) =>
    guarded(out, () => post('/api/approve', { thread_id: threadId, approved }), approved ? 'Applying the fix...' : 'Rejecting...');
  out.replaceChildren();
  const d = data.diagnosis;
  if (d) {
    add(out, 'h3', `Diagnosis (confidence: ${d.confidence})`);
    add(out, 'p', d.root_cause);
    add(out, 'pre', `Evidence:\n${bullets(d.evidence)}\n\nRuled out:\n${bullets(d.ruled_out)}`);
  }
  if (data.history && data.history.length) {
    add(out, 'h3', 'Earlier attempts');
    add(out, 'pre', data.history.join('\n\n'));
  }
  if (data.plan) {
    add(out, 'h3', 'Proposed plan');
    add(out, 'p', data.plan.summary);
    for (const a of data.plan.actions) {
      const text = `${a.tool}(${JSON.stringify(a.args)})\n${a.reason}\nguard: ${a.guard}`;
      add(out, 'pre', text, a.guard === 'allowed' ? '' : 'blocked');
    }
  }
  if (data.status === 'awaiting_approval') {
    const bar = add(out, 'p', '');
    add(bar, 'button', 'Approve').onclick = () => decide(true);
    add(bar, 'button', 'Reject').onclick = () => decide(false);
  }
  if (data.results && data.results.length) {
    add(out, 'h3', 'Actions taken');
    add(out, 'pre', data.results.join('\n'));
  } else if (data.status === 'done') {
    add(out, 'p', 'No changes were made to the cluster.');
  }
  if (data.verification) {
    add(out, 'h3', `Verification (attempt ${data.attempts})`);
    add(out, 'pre', `${data.verification.fixed ? 'FIXED' : 'NOT FIXED'}: ${data.verification.evidence}`);
  }
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const STEP_LABELS = { investigate: 'investigated', propose: 'planned', human_approval: 'approval', apply_fix: 'applied fix', verify_fix: 'verified' };

// Start a background run, then poll its status until it pauses or finishes.
async function guarded(out, fn, busyText) {
  out.textContent = busyText;
  let failures = 0;
  try {
    const { thread_id } = await fn();
    for (;;) {
      await sleep(2000);
      let data;
      try {
        const res = await fetch(`/api/status/${thread_id}`);
        if (!res.ok) throw new Error(await res.text());
        data = await res.json();
        failures = 0;
      } catch (e) {
        if (++failures >= 15) throw e;  // tolerate brief port-forward drops
        continue;
      }
      if (data.status === 'running') {
        const done = data.steps.map((s) => STEP_LABELS[s] || s).join(' > ');
        out.textContent = `${busyText} (${Math.round(data.elapsed)} s${done ? ', ' + done : ''})`;
        continue;
      }
      if (data.status === 'error') throw new Error(data.error);
      if (data.status === 'interrupted') throw new Error('The agent restarted during this run. Send the request again.');
      render(data, out);
      return;
    }
  } catch (e) { out.textContent = String(e); }
}

$('send').onclick = () => {
  const message = $('msg').value.trim();
  if (!message) return;
  const turn = add($('log'), 'div', '', 'turn');
  add(turn, 'p', message, 'user');
  const out = add(turn, 'div', '');
  $('msg').value = '';
  guarded(out, () => post('/api/chat', { message, conversation_id: conversationId }), 'Investigating...');
};

const opened = new Set();

async function refreshAlerts() {
  try {
    const res = await fetch('/api/alerts');
    if (!res.ok) return;
    const rows = await res.json();
    const list = $('alert-list');
    list.replaceChildren();
    $('alert-note').textContent = rows.length ? '' : '(none yet; they appear when Prometheus fires one)';
    for (const r of rows) {
      const row = add(list, 'div', '', 'alert');
      const label = r.queued ? 'queued' : r.status;
      add(row, 'span', label, `badge ${r.status}`);
      add(row, 'span', `${r.alertname}: ${r.namespace}/${r.resource}${r.alert_state === 'resolved' ? ' (resolved)' : ''}`);
      if (r.actions.length) add(row, 'span', `proposes ${r.actions.join(', ')}`, 'badge');
      add(row, 'button', 'Open').onclick = () => openAlert(r);
      const link = add(row, 'a', 'Graphs');
      link.href = r.graph_url; link.target = '_blank'; link.rel = 'noopener';
    }
  } catch (e) { /* the next poll will retry */ }
}

function openAlert(r) {
  const turn = add($('log'), 'div', '', 'turn');
  add(turn, 'p', `Alert ${r.alertname}: ${r.namespace}/${r.resource}`, 'user');
  guarded(add(turn, 'div', ''), async () => ({ thread_id: r.thread_id }), 'Loading...');
}

refreshAlerts();
setInterval(refreshAlerts, 5000);

$('reset').onclick = () => {
  conversationId = null;
  total.in = total.out = total.sec = 0;
  $('log').replaceChildren();
  $('usage').textContent = 'conversation tokens in/out: 0 / 0 | LLM time: 0 s | cost: $0.00';
};
</script>
</body>
</html>
