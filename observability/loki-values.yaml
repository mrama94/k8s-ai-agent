# Loki in single-binary mode, filesystem storage, 6 h retention. Lab sizing, no auth, no persistence.
# Chart: grafana/loki 7.3.0 (pinned in install.sh).
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 6h
    reject_old_samples: true
    reject_old_samples_max_age: 6h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false
singleBinary:
  replicas: 1
  persistence:
    enabled: false
  # no PVC in the lab, but Loki still needs a writable /var/loki (the root filesystem is read-only)
  extraVolumes:
    - name: loki-data
      emptyDir: {}
  extraVolumeMounts:
    - name: loki-data
      mountPath: /var/loki
  resources:
    requests: { cpu: 50m, memory: 150Mi }
    limits: { memory: 350Mi }
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
minio: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
