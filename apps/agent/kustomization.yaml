apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - alert-webhook-token.sealedsecret.yaml   # encrypted; see bootstrap/sealed-secrets
  - ghcr-pull.sealedsecret.yaml             # encrypted credential to pull the private image
# The one place the agent image is set. CI (.github/workflows/agent-image.yml) rewrites newName and newTag after each
# build, and Argo CD rolls the agent out. Do not edit these two lines by hand.
images:
  - name: k8s-agent
    newName: ghcr.io/mrama94/k8s-agent
    newTag: sha-da62975
