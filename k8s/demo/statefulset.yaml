apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: store
  namespace: demo
spec:
  serviceName: store
  replicas: 1
  selector:
    matchLabels:
      app: store
  template:
    metadata:
      labels:
        app: store
    spec:
      containers:
        - name: db
          image: nginx:no-such-tag-store
