apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: git@github.com:mrama94/k8s-ai-agent.git
    targetRevision: main
    path: platform/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      # The SealedSecret CRD comes from the sealed-secrets app; do not fail the first sync if it is a moment late.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
