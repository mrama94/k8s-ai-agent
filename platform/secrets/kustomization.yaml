apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Encrypted secrets for the monitoring namespace. Safe to commit: only the Sealed Secrets controller in this
# cluster, holding the private key, can decrypt them, and only into this namespace under these names.
resources:
  - grafana-admin.sealedsecret.yaml
  - alert-webhook-token.sealedsecret.yaml
