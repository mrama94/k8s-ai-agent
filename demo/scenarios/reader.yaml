apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: demo
data:
  MODE: broken
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reader
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reader
  template:
    metadata:
      labels:
        app: reader
    spec:
      containers:
        - name: reader
          image: busybox
          command: ["sh", "-c", "echo MODE=$MODE; sleep 3600"]
          env:
            - name: MODE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MODE
          readinessProbe:
            exec:
              command: ["sh", "-c", "test $MODE = ok"]
            periodSeconds: 5
