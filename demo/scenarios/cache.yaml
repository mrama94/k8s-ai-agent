apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: busybox
          command: ["sh", "-c", "touch /tmp/ready && sleep 3600"]
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            periodSeconds: 5
