apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deployed from here: the namespace and the healthy storefront workload. The broken workloads in ../scenarios are test
# fixtures that you apply by hand for one test, so they are deliberately NOT part of this kustomization (a GitOps tool
# would deploy all of them at once).
resources:
  - namespace.yaml
  - storefront.yaml
