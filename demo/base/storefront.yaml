# A healthy workload that git owns. It gives Argo CD something real to compare against: when the agent (or you) changes it
# live, Argo CD shows it as OutOfSync and, because auto-heal is off for the demo app, leaves the live fix in place.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: demo
spec:
  replicas: 4
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: demo
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 80
